[project]
name = "number-game"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "matplotlib",
    "numpy",
    "openai",
    "pandas",
    "ruamel-yaml",
    "scipy",
    "seaborn",
    "tinker",
    "tinker-cookbook",
    "transformers",
]

[project.optional-dependencies]
cpu = ["torch"]
mps = ["torch; platform_system == 'Darwin' and platform_machine == 'arm64'"]
cu124 = ["torch"]
cu126 = ["torch"]
cu128 = ["torch"]
cu130 = ["torch"]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "mps" },
        { extra = "cu124" },
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cu130" },
    ],
]
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'Darwin'" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]
